name: CI

on: [push, pull_request]

jobs:
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Model tests and cocotb suite (6 builds, int8/ternary x base/perf/db, functional coverage)
        run: pytest tests/ tb/test_runner.py -v
      - name: End-to-end MLP on the RTL (8 images per build per dataset) and perf counters
        run: pytest tb/test_e2e_runner.py tb/test_perf_runner.py -v
      - name: UART at 115200 timing
        run: pytest tb/test_fpga_runner.py -k uart -v
      # Not in CI: the full FPGA-wrapper MLP simulation (minutes per build), the
      # LibreLane flow and gate-level power (hours, need the nix toolchain).
